<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="utf-8" />
    <title>ReportBro Designer Offline</title>
    <link rel="stylesheet" href="/static/reportbro-designer/reportbro.css" />
    <style>
      body {
        margin: 0;
        font-family: "Open Sans", Arial, sans-serif;
        background: #f5f5f5;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }
      .toolbar {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.75rem 1rem;
        background: #1f2933;
        color: #f7fafc;
      }
      .toolbar button,
      .toolbar select {
        border: none;
        border-radius: 4px;
        padding: 0.5rem 0.75rem;
        font-size: 0.95rem;
      }
      .toolbar button {
        background: #2563eb;
        color: #fff;
        cursor: pointer;
      }
      .toolbar button.secondary {
        background: #475569;
      }
      .toolbar button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      .toolbar select {
        min-width: 12rem;
      }
      #status-bar {
        margin-left: auto;
        font-size: 0.85rem;
      }
      #designer {
        height: calc(100vh - 64px);
        flex: 1;
        position: relative;
        min-height: 0;
      }
      .toast {
        position: fixed;
        right: 1.5rem;
        bottom: 1.5rem;
        min-width: 240px;
        max-width: 360px;
        background: #1f2933;
        color: #fff;
        padding: 1rem;
        border-radius: 6px;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.4);
        display: none;
        z-index: 9999;
      }
      .toast.show { display: block; }
      .toast.error { background: #b91c1c; }
      #template-dialog {
        position: fixed;
        inset: 0;
        background: rgba(15, 23, 42, 0.65);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 9998;
        padding: 1.5rem;
      }
      #template-dialog.show {
        display: flex;
      }
      #template-dialog .dialog-panel {
        background: #fff;
        color: #0f172a;
        border-radius: 10px;
        box-shadow: 0 24px 48px rgba(15, 23, 42, 0.35);
        max-width: 480px;
        width: min(100%, 480px);
        padding: 1.75rem;
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }
      #template-dialog h2 {
        margin: 0;
        font-size: 1.35rem;
      }
      #template-dialog p {
        margin: 0;
        font-size: 0.95rem;
        color: #475569;
      }
      #template-dialog label {
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
        font-weight: 600;
      }
      #template-dialog select {
        border: 1px solid #cbd5f5;
        border-radius: 6px;
        padding: 0.55rem 0.75rem;
        font-size: 0.95rem;
      }
      #template-dialog .dialog-actions {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      #template-dialog .dialog-actions .spacer {
        flex: 1 1 auto;
      }
      #template-dialog button {
        border: none;
        border-radius: 6px;
        padding: 0.5rem 0.85rem;
        font-size: 0.95rem;
        cursor: pointer;
      }
      #template-dialog button.primary {
        background: #2563eb;
        color: #fff;
      }
      #template-dialog button.secondary {
        background: #e2e8f0;
        color: #1f2937;
      }
      #template-dialog button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
    </style>
    <script src="/static/reportbro-designer/reportbro.js"></script>
  </head>
  <body>
    <div class="toolbar">
      <button id="btn-new" class="secondary">Novo</button>
      <select id="template-select"></select>

      <!-- Abrir do DISCO -->
      <button id="btn-open" class="secondary" title="Abrir template (.json) do disco">Abrir</button>
      <input id="open-file" type="file" accept=".json,application/json" style="display:none" aria-hidden="true" />

      <button id="btn-save">Guardar</button>
      <button id="btn-save-as" class="secondary" title="Exportar template para JSON">Guardar como</button>
      <button
        id="btn-reopen-server"
        class="secondary"
        title="Reabrir seleção de templates do servidor"
      >
        Templates do servidor
      </button>
      <button id="btn-preview" class="secondary">Preview PDF</button>
      <div id="status-bar"></div>
    </div>

    <div id="designer"></div>
    <div id="toast" class="toast"></div>
    <div
      id="template-dialog"
      role="dialog"
      aria-modal="true"
      aria-labelledby="template-dialog-title"
      hidden
    >
      <div class="dialog-panel">
        <h2 id="template-dialog-title">Escolher template</h2>
        <p>Selecione um template existente ou crie um novo em branco.</p>
        <label for="template-dialog-select">
          Templates disponíveis
          <select id="template-dialog-select"></select>
        </label>
        <div class="dialog-actions">
          <button id="template-dialog-new" class="secondary" type="button">Novo em branco</button>
          <span class="spacer"></span>
          <button id="template-dialog-cancel" class="secondary" type="button">Cancelar</button>
          <button id="template-dialog-open" class="primary" type="button">Abrir template</button>
        </div>
      </div>
    </div>

    <script>
      const DEFAULT_DOCUMENT_PROPERTIES = {
        pageSize: "A4",
        orientation: "portrait",
        unit: "mm",
        marginLeft: 20,
        marginRight: 20,
        marginTop: 20,
        marginBottom: 20,
        contentHeight: "",
        header: true,   // fix True -> true
        footer: true,   // fix True -> true
        patternLocale: "pt_PT",
        patternCurrencySymbol: "€",
        patternNumberGroupSymbol: " ",
      };

      const EMPTY_TEMPLATE = {
        version: 7,
        docElements: [],
        parameters: [],
        dataSets: [],
        styles: [],
        watermarks: [],
        documentProperties: { ...DEFAULT_DOCUMENT_PROPERTIES },
      };

      function normaliseTemplateSchema(report) {
        if (!report || typeof report !== "object") return;

        if (typeof report.version !== "number") report.version = 7;
        if (!Array.isArray(report.docElements)) report.docElements = [];
        if (!Array.isArray(report.parameters)) report.parameters = [];
        if (!Array.isArray(report.dataSets)) report.dataSets = [];
        if (!Array.isArray(report.styles)) report.styles = [];
        if (!Array.isArray(report.watermarks)) report.watermarks = [];

        let properties = report.documentProperties;
        if (!properties || typeof properties !== "object") properties = {};

        if (typeof properties.pageSize !== "string" || !properties.pageSize.trim()) {
          if (typeof properties.pageFormat === "string" && properties.pageFormat.trim()) {
            properties.pageSize = properties.pageFormat.trim();
          }
        }

        properties = { ...DEFAULT_DOCUMENT_PROPERTIES, ...properties };
        delete properties.pageFormat;

        properties.pageSize = (typeof properties.pageSize === "string" && properties.pageSize.trim()) || DEFAULT_DOCUMENT_PROPERTIES.pageSize;
        properties.unit = (typeof properties.unit === "string" && properties.unit.trim()) || DEFAULT_DOCUMENT_PROPERTIES.unit;

        if (typeof properties.contentHeight === "number") properties.contentHeight = String(properties.contentHeight);
        if (typeof properties.contentHeight !== "string") properties.contentHeight = "";

        report.documentProperties = properties;
      }

      // ---------------- estado/refs ----------------
      let designerInstance = null;
      let currentTemplateName = null;
      let templatesCache = [];

      const toastElement = document.getElementById("toast");
      const statusBar = document.getElementById("status-bar");
      const selectElement = document.getElementById("template-select");
      const openFileInput = document.getElementById("open-file");
      const btnOpen = document.getElementById("btn-open");
      const dialogElement = document.getElementById("template-dialog");
      const dialogSelect = document.getElementById("template-dialog-select");
      const dialogOpenButton = document.getElementById("template-dialog-open");
      const dialogCancelButton = document.getElementById("template-dialog-cancel");
      const dialogNewButton = document.getElementById("template-dialog-new");
      const downloadLink = document.createElement("a");
      downloadLink.style.display = "none";
      document.body.appendChild(downloadLink);

      let currentLocationDescriptor = "";

      function buildServerLocation(name) {
        if (!name) return "";
        const encoded = encodeURIComponent(name);
        return new URL(`/templates/${encoded}.json`, window.location.origin).toString();
      }

      function setLocationDescriptor(value) {
        currentLocationDescriptor = value || "";
      }

      window.bwbGetCurrentLocation = () => currentLocationDescriptor;

      window.bwbExportCurrentTemplate = () => {
        if (!designerInstance || typeof designerInstance.getReport !== "function") {
          return { success: false, error: "ReportBro Designer indisponível." };
        }
        try {
          const report = cloneTemplate(designerInstance.getReport());
          normaliseTemplateSchema(report);
          return {
            success: true,
            report,
            name: currentTemplateName || "",
            location: currentLocationDescriptor,
          };
        } catch (error) {
          console.error(error);
          return {
            success: false,
            error: error?.message || "Falha ao exportar o template actual.",
          };
        }
      };

      function showToast(message, variant = "info") {
        toastElement.textContent = message;
        toastElement.className = `toast ${variant === "error" ? "error" : ""} show`;
        setTimeout(() => { toastElement.className = "toast"; }, 3500);
      }

      function setStatus(message) { statusBar.textContent = message || ""; }
      function cloneTemplate(tpl) { return JSON.parse(JSON.stringify(tpl)); }

      function resetDesigner(message = "") {
        if (!designerInstance) return;
        designerInstance.load(cloneTemplate(EMPTY_TEMPLATE));
        designerInstance.setModified(false);
        currentTemplateName = null;
        selectElement.value = "";
        setStatus(message);
        setLocationDescriptor("");
      }

      function sortTemplatesForDisplay(items) {
        return [...items].sort((a, b) => {
          const originRankA = a.origin === "store" ? 0 : 1;
          const originRankB = b.origin === "store" ? 0 : 1;
          if (originRankA !== originRankB) return originRankA - originRankB;
          return a.name.localeCompare(b.name, undefined, { sensitivity: "base" });
        });
      }

      function populateTemplateDialog() {
        dialogSelect.innerHTML = "";
        const placeholder = document.createElement("option");
        placeholder.value = "";
        placeholder.textContent = "-- selecionar --";
        dialogSelect.appendChild(placeholder);

        const sorted = sortTemplatesForDisplay(templatesCache);
        for (const template of sorted) {
          const option = document.createElement("option");
          option.value = template.name;
          const originLabel = template.origin === "store" ? "Modelo base" : "Personalizado";
          option.textContent = `${template.name} · ${originLabel}`;
          dialogSelect.appendChild(option);
        }

        if (currentTemplateName) {
          dialogSelect.value = currentTemplateName;
        } else {
          const preferred = sorted.find((tpl) => tpl.origin === "store") || sorted[0];
          if (preferred) dialogSelect.value = preferred.name;
        }
        dialogOpenButton.disabled = !dialogSelect.value;
      }

      function openTemplateDialog() {
        if (dialogElement.classList.contains("show")) return;
        populateTemplateDialog();
        dialogElement.hidden = false;
        dialogElement.classList.add("show");
        setTimeout(() => {
          dialogSelect.focus();
        }, 50);
      }

      function closeTemplateDialog() {
        dialogElement.classList.remove("show");
        dialogElement.hidden = true;
      }

      function promptTemplateSelection() {
        if (!templatesCache.length) {
          resetDesigner("Sem templates disponíveis. Utilize 'Novo' para criar um em branco.");
          return;
        }
        resetDesigner("Selecione um template para começar.");
        openTemplateDialog();
      }

      // ---------------- lista (opcional, servidor) ----------------
      async function refreshTemplates() {
        try {
          const response = await fetch("/templates/list");
          if (!response.ok) throw new Error();
          const payload = await response.json();
          templatesCache = Array.isArray(payload)
            ? payload.map((item) => ({ ...item, origin: item.origin === "store" ? "store" : "runtime" }))
            : [];
        } catch {
          templatesCache = []; // segue sem lista
        }
        populateTemplateSelect();
      }

      function populateTemplateSelect() {
        selectElement.innerHTML = "";
        const placeholder = document.createElement("option");
        placeholder.value = "";
        placeholder.textContent = "-- escolher template (servidor) --";
        selectElement.appendChild(placeholder);
        const sorted = sortTemplatesForDisplay(templatesCache);
        for (const template of sorted) {
          const option = document.createElement("option");
          option.value = template.name;
          option.textContent = `${template.name} (${new Date(template.updated_at).toLocaleString()})`;
          if (template.name === currentTemplateName) option.selected = true;
          selectElement.appendChild(option);
        }
      }

      async function loadTemplate(name) {
        const response = await fetch(`/templates/${encodeURIComponent(name)}`);
        if (!response.ok) throw new Error(`Não foi possível carregar o template '${name}'.`);
        const report = await response.json();
        normaliseTemplateSchema(report);
        designerInstance.load(report);
        designerInstance.setModified(false);
        currentTemplateName = name;
        setStatus(`Template activo: ${name}`);
        showToast(`Template '${name}' carregado.`);
        setLocationDescriptor(buildServerLocation(name));
        closeTemplateDialog();
      }

      // ---------------- Abrir do DISCO ----------------
      function triggerOpenFromDisk() {
        openFileInput.value = ""; // permite reabrir o mesmo ficheiro
        openFileInput.click();
      }

      function buildDownloadName(baseName = "") {
        const sanitized = String(baseName || "")
          .trim()
          .toLowerCase()
          .replace(/[^a-z0-9_-]+/g, "-")
          .replace(/-+/g, "-")
          .replace(/^-|-$/g, "");
        if (sanitized) return `${sanitized}.json`;
        const timestamp = new Date().toISOString().replace(/[:.]/g, "-");
        return `template-${timestamp}.json`;
      }

      async function handleExportToDisk() {
        const result = window.bwbExportCurrentTemplate?.();
        if (!result?.success) {
          const message = result?.error || "Não foi possível exportar o template actual.";
          showToast(message, "error");
          return;
        }
        const payload = JSON.stringify(result.report, null, 2);
        const filename = buildDownloadName(result.name || result.location);
        const hasFilePicker = typeof window.showSaveFilePicker === "function";
        let pickerFailed = false;

        if (hasFilePicker) {
          try {
            const fileHandle = await window.showSaveFilePicker({
              suggestedName: filename,
              types: [
                {
                  description: "Ficheiros JSON",
                  accept: {
                    "application/json": [".json"],
                  },
                },
              ],
            });
            const writable = await fileHandle.createWritable();
            await writable.write(payload);
            await writable.close();
            const savedName = fileHandle?.name || filename;
            setStatus(`Template guardado com o diálogo do sistema: ${savedName}`);
            showToast(`Template guardado como '${savedName}'.`);
            return;
          } catch (pickerError) {
            if (pickerError?.name === "AbortError") {
              setStatus("Exportação cancelada pelo utilizador.");
              showToast("Exportação cancelada.");
              return;
            }
            console.warn("Falha ao usar showSaveFilePicker, a recuar para download.", pickerError);
            pickerFailed = true;
          }
        }

        try {
          const blob = new Blob([payload], { type: "application/json" });
          const url = URL.createObjectURL(blob);
          downloadLink.href = url;
          downloadLink.download = filename;
          downloadLink.click();
          setTimeout(() => URL.revokeObjectURL(url), 2500);
          const statusMessage = pickerFailed
            ? `Diálogo do sistema indisponível; download directo iniciado: ${filename}`
            : `Download directo do template iniciado: ${filename}`;
          setStatus(statusMessage);
          const toastMessage = pickerFailed
            ? `Download directo de '${filename}' iniciado após falha do diálogo do sistema.`
            : `Download de '${filename}' iniciado.`;
          showToast(toastMessage);
        } catch (error) {
          console.error(error);
          showToast("Falha ao preparar o download do template.", "error");
        }
      }

      async function handleOpenFromDisk(ev) {
        const file = ev.target.files?.[0];
        if (!file) return;
        try {
          const text = await file.text();
          const parsed = JSON.parse(text);
          normaliseTemplateSchema(parsed);
          designerInstance.load(parsed);
          designerInstance.setModified(false);
          currentTemplateName = file.name.replace(/\.json$/i, "");
          selectElement.value = ""; // limpa seleção do servidor
          setStatus(`Template aberto do disco: ${file.name}`);
          showToast(`Aberto: ${file.name}`);
          setLocationDescriptor(file.name);
        } catch (err) {
          console.error(err);
          showToast("Ficheiro inválido ou JSON malformado.", "error");
        }
      }

      async function handleReopenServerDialog() {
        if (!templatesCache.length) {
          await refreshTemplates();
        }
        if (!templatesCache.length) {
          setStatus("Sem templates do servidor disponíveis.");
          showToast("Não há templates do servidor para seleccionar.", "error");
          return;
        }
        setStatus("Selecione um template do servidor.");
        openTemplateDialog();
      }

      // ---------------- guardar/preview ----------------
      async function saveTemplate(name, report, overwrite = false) {
        const url = new URL(`/templates/${encodeURIComponent(name)}`, window.location.origin);
        if (overwrite) url.searchParams.set("overwrite", "1");
        const response = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(report),
        });
        if (response.status === 409) return { conflict: true };
        if (!response.ok) {
          const payload = await response.json().catch(() => ({}));
          throw new Error(payload.error || "Falha ao guardar o template.");
        }
        const payload = await response.json();
        return { conflict: false, payload };
      }

      async function persistTemplate(overwrite = false) {
        // ReportBro devolve uma referência interna com getReport(); criamos uma
        // cópia independente para que a normalização não altere o estado da UI.
        const report = cloneTemplate(designerInstance.getReport());
        normaliseTemplateSchema(report);
        let targetName = currentTemplateName;
        if (!targetName) {
          const input = window.prompt("Nome do template (slug em minúsculas):");
          if (!input) { showToast("Operação cancelada.", "error"); return; }
          targetName = input.trim();
        }
        try {
          const result = await saveTemplate(targetName, report, overwrite);
          if (result.conflict && !overwrite) {
            const confirmed = window.confirm("O template já existe. Pretende substituir o ficheiro?");
            if (confirmed) { await persistTemplate(true); }
            return;
          }
          currentTemplateName = targetName;
          designerInstance.setModified(false);
          await refreshTemplates();
          setStatus(`Template activo: ${targetName}`);
          showToast("Template guardado com sucesso.");
          setLocationDescriptor(buildServerLocation(targetName));
        } catch (error) {
          console.error(error);
          showToast(error.message, "error");
        }
      }

      async function previewTemplate() {
        try {
          const report = designerInstance.getReport();
          const response = await fetch("/rb/preview", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ templateJson: report }),
          });
          if (!response.ok) {
            const payload = await response.json().catch(() => ({}));
            throw new Error(payload.error || "Falha ao gerar o PDF.");
          }
          const blob = await response.blob();
          const url = URL.createObjectURL(blob);
          window.open(url, "_blank");
          showToast("Pré-visualização gerada.");
        } catch (error) {
          console.error(error);
          showToast(error.message, "error");
        }
      }

      function handleNew() {
        resetDesigner("Template novo (por guardar)");
        showToast("Template em branco criado.");
        setLocationDescriptor("");
        closeTemplateDialog();
      }

      // ---------- autodeteção do construtor do Designer ----------
      function findDesignerFactory() {
        if (window.ReportBro) return { type: "ctor", name: "ReportBro", value: window.ReportBro };
        if (window.reportbro?.Designer) return { type: "ctor", name: "reportbro.Designer", value: window.reportbro.Designer };
        if (window.ReportBroDesigner) return { type: "ctor", name: "ReportBroDesigner", value: window.ReportBroDesigner };
        if (window.reportbro?.create) return { type: "factory", name: "reportbro.create", value: window.reportbro.create };
        if (window.ReportBro?.create) return { type: "factory", name: "ReportBro.create", value: window.ReportBro.create };
        return null;
      }

      async function bootstrap() {
        const factory = findDesignerFactory();
        if (!factory) {
          const near = Object.keys(window).filter(k => k.toLowerCase().includes("report"));
          console.error("Construtor do ReportBro não encontrado. Chaves parecidas:", near);
          showToast("Falha a iniciar o ReportBro Designer (JS). Ver consola.", "error");
          return;
        }
        console.log("ReportBro: a usar", factory.name);

        const host = document.getElementById("designer");
        try {
          if (factory.type === "ctor") {
            designerInstance = new factory.value(host, {
              reportServerUrl: "/rb/preview",
              saveCallback: () => persistTemplate(false),
              requestCallback: (params) => {
                params.reportServerHeaders = { "Content-Type": "application/json" };
                params.reportServerUrl = "/rb/preview";
              },
            });
          } else {
            designerInstance = factory.value(host, { reportServerUrl: "/rb/preview" });
          }
        } catch (e) {
          console.error(e);
          showToast("Erro ao construir o Designer.", "error");
          return;
        }

        // Botões
        document.getElementById("btn-new").addEventListener("click", handleNew);
        btnOpen.addEventListener("click", triggerOpenFromDisk);
        openFileInput.addEventListener("change", handleOpenFromDisk);
        document.getElementById("btn-save").addEventListener("click", () => persistTemplate(false));
        document.getElementById("btn-save-as").addEventListener("click", () => handleExportToDisk());
        document
          .getElementById("btn-reopen-server")
          .addEventListener("click", () => {
            void handleReopenServerDialog();
          });
        document.getElementById("btn-preview").addEventListener("click", () => previewTemplate());
        dialogSelect.addEventListener("change", () => {
          dialogOpenButton.disabled = !dialogSelect.value;
        });
        dialogCancelButton.addEventListener("click", () => {
          closeTemplateDialog();
          setStatus("Selecione um template para começar.");
        });
        dialogNewButton.addEventListener("click", () => {
          closeTemplateDialog();
          handleNew();
        });
        dialogOpenButton.addEventListener("click", async () => {
          const name = dialogSelect.value;
          if (!name) return;
          try {
            await loadTemplate(name);
            selectElement.value = name;
          } catch (error) {
            console.error(error);
            const message = error?.message || "Falha ao carregar o template.";
            showToast(message, "error");
          }
        });

        selectElement.addEventListener("change", async (event) => {
          const select = event.target;
          if (!(select instanceof HTMLSelectElement)) return;
          const name = select.value;
          if (!name) return;
          try {
            await loadTemplate(name);
          } catch (error) {
            console.error(error);
            const message = error?.message || "Falha ao carregar o template.";
            showToast(message, "error");
            select.value = "";
          }
        });

        resetDesigner("Selecione um template para começar.");
        await refreshTemplates();
        promptTemplateSelection();
      }

      window.addEventListener("DOMContentLoaded", bootstrap);
    </script>
  </body>
</html>
